# ============================================================
#  CustomCraft - configuration
#  After editing, just run /forge reload (no restart needed).
#
#  The forge menu opens ONLY from a crafting table:
#  shift + right-click it with an empty hand.
#  Weapons and relics start a forge RITUAL on that
#  crafting table and drop on it when the ritual ends. Every weapon
#  can exist only once on the whole server.
#
#  "forge" section = materials needed in the menu (max 5 different):
#      forge:
#        - { item: DIAMOND, amount: 16 }
#        - { item: "weapon:echo_blade", amount: 1 }
#  A material can be a vanilla item or another custom item
#  (weapon:<id> / relic:<id>). Amount can be higher than 64.
#
#  Optionally you can also add a vanilla shaped "recipe" for the
#  crafting table, see README.
# ============================================================

# Unlock vanilla "recipe" recipes (if any) in the recipe book on join
discover-recipes-on-join: true

menu:
  # Forge menu look with the CustomCraft-pack resource pack (background, buttons, icons):
  #   auto  = only for players who loaded the SERVER resource pack (server.properties resource-pack)
  #   true  = always (use this when testing with the pack installed locally in .minecraft/resourcepacks)
  #   false = never (plain menu with glass panes)
  # Without the pack, true shows odd characters in the menu title.
  resource-pack: auto
  title-weapons: "&8Forge • Weapons"
  title-relics: "&8Forge • Relics"
  title-loot: "&8Possible Loot"

messages:
  prefix: "&8[&6CustomCraft&8] &7"
  no-permission: "&cYou don't have permission to do that."
  player-only: "&cOnly players can use this command."
  reloaded: "&aConfig reloaded (&e{weapons} &aweapons, &e{relics} &arelics)."
  unknown-item: "&cUnknown item '{item}'. Use weapon:<id> or relic:<id>."
  unknown-player: "&cPlayer '{player}' is not online."
  given: "&aGave &e{amount}x &a{item} &ato &e{player}&a."
  forge-select-first: "&cSelect a recipe first."
  forge-missing: "&cYou don't have enough materials."
  forge-crafted: "&aYou forged {item}&a."
  # relics
  relic-cooldown: "&c{relic} &7is recharging: &c{time}"
  relic-wrong-slot: "&cThis relic only works in your {slot}."
  relic-revived: "&f✦ {player} &7was saved by {relic}&7!"
  relic-wounded: "&4✖ Grievous Wounds &7- you can't heal for a moment"
  relic-shrugged: "&3⛨ Shrugged off &f{amount} ❤"
  usage: "&7Usage: &e/forge [reload | status | give <player> <weapon:id|relic:id> [amount] | release <id> | finish <id>]"
  forge-open-hint: "&7Shift + right-click a &fcrafting table &7with an empty hand to open the forge."
  # forge rituals ({where} is replaced by ritual-where, or nothing if show-coordinates is false)
  ritual-started: "&5⚒ &d{player} &7started forging {item}&7{where}&7! Ready in &d{time}&7."
  ritual-done: "&6⚒ {item} &7has been forged by &6{player}&7{where}&7!"
  ritual-bossbar: "&d⚒ {player} &7is forging {item} &8• &f{time}{where}"
  ritual-where: " &7at &f{x} {y} {z}"
  ritual-where-area: " &7around &f{x} {z} &8(±{radius} blocks)"
  ritual-where-world: " &7somewhere in &f{world}"
  ritual-reveal-area: "&5📍 &7The forge of {item} &7is narrowing down{where}&7."
  ritual-reveal-exact: "&5📍 &7The forge of {item} &7has been revealed{where}&7!"
  ritual-busy-table: "&cThis crafting table is already performing a ritual."
  ritual-no-table: "&cStand next to the crafting table to start the ritual."
  ritual-protected: "&cThe forge ritual protects this crafting table."
  ritual-finishing: "&aFinishing the ritual for {weapon}..."
  ritual-none: "&7No ritual is running for {weapon}."
  # unique weapons
  weapon-claimed: "&c{item} &7already exists. It was claimed by &c{player}&7."
  weapon-in-ritual: "&c{item} &7is being forged by &c{player} &7right now."
  weapon-destroyed: "&7{item} &7was destroyed and can be forged again!"
  weapon-released: "&a{weapon} can be forged again."
  weapon-not-claimed: "&7{weapon} wasn't claimed."
  # legendary materials
  material-found: "&5✦ &d{player} &7found {item}&7!"
  material-found-private: "&5✦ &7You found {item}&7!"
  # weapon abilities (shown in the action bar)
  ability-cooldown: "&c{ability} &7is recharging: &c{time}s"
  ability-used: "&a» {ability}&a!"
  ability-no-target: "&cNo target in range."
  ability-rewind-none: "&cNo echo to return to yet."
  ability-rewind-blocked: "&cYour past position is blocked."
  ability-resonance-none: "&cNothing is resonating. Hit something first."
  ability-hexed: "&2You have been hexed!"
  ability-link-broken: "&3Soul link broken."
  ability-no-souls: "&3You have no souls to harvest."
  ability-too-hurt: "&cYou're too hurt for that."
  ability-devour-full: "&cYour belly is already full."
  ability-devour-too-big: "&cThat's way too big to swallow."
  ability-devour-taste: "&cIt needs &6{stacks} Taste &cstacks first."
  ability-devoured-ally: "&3You were swallowed for safety. &7Sneak to hop out."
  ability-devoured-enemy: "&4You've been devoured!"

# ------------------------------------------------------------
#  CRAFTABLE - switch items on/off without deleting them
#  false on a weapon/relic: it disappears from the forge and can't be made
#                           (copies that already exist keep working)
#  false on a material:     it stops dropping from mobs, chests and vaults
#  Missing entries count as true. Apply with /forge reload.
# ------------------------------------------------------------
craftable:
  weapons:
    echo_blade: true
    graviton_hammer: true
    hex_bow: true
    soulbinder: true
    hydra_edge: true
    butcher_cleaver: true
    abyssal_maw: true
  relics:
    stasis_hourglass: true
    angels_wings: true
    thorn_plate: true
    heartsteel_core: true
    thick_hide: true
  materials:
    resonant_shard: true
    graviton_core: true
    hexed_thread: true
    soul_ember: true
    hydra_scale: true
    chrono_sand: true
    seraph_feather: true
    thornheart_seed: true
    crimson_heart: true
    ravenous_marrow: true
    abyssal_lure: true
    behemoth_hide: true

# ------------------------------------------------------------
#  FORGE RITUAL (weapons)
#  Clicking FORGE on a weapon takes the materials and starts a ritual on
#  the crafting table. The table can't be broken, blown up or moved while
#  it runs. When it ends, the weapon drops on the table.
#  The timer only runs while the server is online (it survives restarts).
#  Per weapon you can override the length with "ritual-minutes: 30".
# ------------------------------------------------------------
ritual:
  enabled: true
  duration-minutes: 15
  # Who sees the ritual boss bar: ALL, NEARBY or NONE
  bossbar: ALL
  bossbar-radius: 64
  # Show the forger's name? If false, everyone sees hidden-player-name instead
  # (also in the forge menu). The weapon itself is always shown.
  show-player: false
  hidden-player-name: "Someone"
  # Show the location at all (chat + boss bar). false = never show it.
  show-coordinates: true
  # Reveal the location step by step during the ritual (chat announcement + boss bar).
  # at-percent: how far into the ritual (0-100). radius: -1 = only the dimension,
  # n = an area of ±n blocks (randomly shifted, so its centre isn't the table), 0 = exact coordinates.
  # For a 15 minute ritual: 0 min, 5 min, 10 min and 13 min.
  location-reveal:
    enabled: true
    stages:
      - { at-percent: 0, radius: -1 }
      - { at-percent: 33, radius: 500 }
      - { at-percent: 66, radius: 100 }
      - { at-percent: 87, radius: 0 }

# ------------------------------------------------------------
#  UNIQUE WEAPONS AND RELICS
#  Each weapon and relic can exist only once on the server. Once its ritual
#  starts, nobody else can make it.
#  Set "unique: false" on a weapon or relic to exclude it.
#  Admins: /forge status, /forge release <id>
#  (/forge give ignores this, it's an admin tool)
# ------------------------------------------------------------
unique-weapons:
  enabled: true
  # If the weapon is destroyed as a dropped item (lava, fire, cactus, void,
  # despawn), it becomes forgeable again
  release-when-destroyed: true

# ------------------------------------------------------------
#  WEAPON ABILITIES - global settings
# ------------------------------------------------------------
ability-settings:
  enabled: true
  # Cooldowns in the action bar while holding a weapon with abilities
  hud: true
  # Can abilities hurt players? (PvP disabled in a world/region is always respected)
  damage-players: true
  # Damage multiplier for abilities against players (0.5 = half)
  pvp-multiplier: 1.0
  # Worlds where abilities don't work (e.g. spawn / lobby)
  disabled-worlds: []
  # Mobs that Devour (Abyssal Maw) can never swallow (the Wither and the Ender Dragon never can)
  devour-immune: [WARDEN, ELDER_GUARDIAN, RAVAGER, GHAST, HAPPY_GHAST, IRON_GOLEM, SNIFFER]

# ------------------------------------------------------------
#  WEAPONS
#  attack-damage / attack-speed are TOTAL values (as in the tooltip).
#  Vanilla sword: damage 7-9, speed 1.6; axe: speed 0.9-1.1
#  Enchant names: minecraft keys in lower case (sharpness, power, ...)
#
#  abilities:
#    passive:   potion effects while the weapon is held in the main hand
#               effects: { effect_name: level-1 }   (0 = level I)
#               low-health-regen: { below-percent: 30, percent-per-second: 1.5 }
#    on-hit:    effects on hit (charged melee hit, or an arrow from this bow)
#               types: ECHO, CRUSH, RICOCHET, SOUL, LIFESTEAL, CLEAVE, BLUNT_FORCE, TASTE
#    active:    abilities with a cooldown (seconds)
#               trigger: RIGHT_CLICK, SHIFT_RIGHT_CLICK, SWAP (F key), SHIFT_SWAP
#               types: REWIND, RESONANCE, GRAVITY_ANCHOR, UPHEAVAL,
#                      MIRROR_SHOT, HEX_MARK, SOUL_LINK, HARVEST, CRESCENT, FRENZY,
#                      CLEAVER_TOSS, BLOODRUSH, TONGUE_LASH, DEVOUR
#  "max HP" scaling: Cleaver Toss, Bloodrush, Tongue Lash and Devour grow with your
#  MAX health, so they pair well with Heartsteel Core and Health Boost.
#    arrow-trail: particle behind arrows (bows only), e.g. WITCH
#  The ability list is added to the item lore automatically.
#  To remove a default on-hit list, write: on-hit: []
# ------------------------------------------------------------
weapons:
  echo_blade:
    material: NETHERITE_SWORD
    name: "&3&lEcho Blade"
    lore:
      - "&7Every strike rings twice."
    custom-model-data: 1001
    unbreakable: true
    attack-damage: 9
    attack-speed: 1.6
    enchants:
