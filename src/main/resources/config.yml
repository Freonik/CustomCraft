# Small visual effects for worn relics (wing feathers at the ankles, heartbeat, spores)
relic-settings:
  particles: true

# ------------------------------------------------------------
#  RELICS - armor and off-hand items with a special effect
#  They are forged with a ritual and unique, just like weapons.
#  A relic only works in its own slot ("relic.slot"): OFFHAND, HEAD, CHEST, LEGS or FEET,
#  so you can wear one chestplate relic, one boots relic and hold one off-hand relic.
#  (Thorn Plate and Heartsteel are both chestplates - pick one.)
#
#  relic.type: STASIS, REVIVE, THORNS, HEARTSTEEL, THICK_HIDE
#  attributes: stats that only count in the relic's slot (armor, armor_toughness,
#              knockback_resistance, max_health, movement_speed, ...)
#  equipment-model: how the armor looks when worn (from the resource pack)
#  Cooldowns and Heartsteel stacks are stored on the item itself.
#  Relics and weapons can't be used in a smithing table (no trims / upgrades).
# ------------------------------------------------------------
relics:
  stasis_hourglass:
    material: CLOCK
    name: "&6&lStasis Hourglass"
    lore:
      - "&7Time stops for whoever holds it."
    custom-model-data: 1201
    relic:
      type: STASIS
      slot: OFFHAND
      cooldown: 120
      duration: 2.5
      description: ["Right-click: turn into a golden statue", "for 2.5s. You can't be hurt, but you", "can't move or attack either."]
    forge:
      - { item: CLOCK, amount: 4 }
      - { item: GOLD_BLOCK, amount: 16 }
      - { item: AMETHYST_SHARD, amount: 32 }
      - { item: "material:chrono_sand", amount: 1 }

  angels_wings:
    material: NETHERITE_BOOTS
    name: "&f&lAngel's Wings"
    lore:
      - "&7Light as a feather, stubborn as a saint."
    custom-model-data: 1202
    unbreakable: true
    equipment-model: "customcraft:angels_wings"
    attributes:
      armor: 3
      armor_toughness: 3
      knockback_resistance: 0.1
    relic:
      type: REVIVE
      slot: FEET
      cooldown: 600
      heal-percent: 50
      protection-seconds: 3
      fall-reduction: 50
      description: ["When you would die: come back with", "50% HP and 3s of protection.", "Half fall damage."]
    forge:
      - { item: NETHERITE_BOOTS, amount: 1 }
