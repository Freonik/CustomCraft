# ============================================================
#  CustomCraft - configuration
#  After editing, just run /forge reload (no restart needed).
#
#  Crafting happens in the /forge menu: the player picks a recipe
#  and clicks Proceed; the plugin takes the materials from their
#  inventory.
#
#  "forge" section = materials needed in the menu (max 5 different):
#      forge:
#        - { item: DIAMOND, amount: 16 }
#        - { item: "box:common", amount: 3 }
#  A material can be a vanilla item or another custom item
#  (weapon:<id> / box:<id>). Amount can be higher than 64.
#
#  Optionally you can also add a vanilla shaped "recipe" for the
#  crafting table, see README.
# ============================================================

# Unlock vanilla "recipe" recipes (if any) in the recipe book on join
discover-recipes-on-join: true

menu:
  # Turn on once players have the CustomCraft-pack resource pack.
  # The menu background and transparent panels/buttons are then drawn by the pack.
  # Keep false without the pack, otherwise players see odd characters in the title.
  resource-pack: false
  # Shift + right-click a crafting table with an empty hand opens the menu
  sneak-click-crafting-table: true
  title-weapons: "&8Forge • Weapons"
  title-boxes: "&8Forge • Mystery Crates"
  title-loot: "&8Possible Loot"

messages:
  prefix: "&8[&6CustomCraft&8] &7"
  no-permission: "&cYou don't have permission to do that."
  player-only: "&cOnly players can use this command."
  reloaded: "&aConfig reloaded (&e{weapons} &aweapons, &e{boxes} &amystery crates)."
  unknown-item: "&cUnknown item '{item}'. Use weapon:<id> or box:<id>."
  unknown-player: "&cPlayer '{player}' is not online."
  given: "&aGave &e{amount}x &a{item} &ato &e{player}&a."
  forge-select-first: "&cSelect a recipe first."
  forge-missing: "&cYou don't have enough materials."
  forge-crafted: "&aYou forged {item}&a."
  box-already-opening: "&cYou are already opening a crate."
  box-empty: "&cThis crate has no loot configured."
  box-reward: "&aYou got: &f{item} &7x{amount}"
  box-broadcast: "&6{player} &7opened {box} &7and won &f{item}&7!"
  usage: "&7Usage: &e/forge [reload | give <player> <weapon:id|box:id> [amount]]"
  # weapon abilities (shown in the action bar)
  ability-cooldown: "&c{ability} &7is recharging: &c{time}s"
  ability-used: "&a» {ability}&a!"
  ability-no-target: "&cNo target in range."
  ability-rewind-none: "&cNo echo to return to yet."
  ability-rewind-blocked: "&cYour past position is blocked."
  ability-resonance-none: "&cNothing is resonating. Hit something first."
  ability-hexed: "&2You have been hexed!"
  ability-link-broken: "&3Soul link broken."
  ability-no-souls: "&3You have no souls to harvest."

# ------------------------------------------------------------
#  WEAPON ABILITIES - global settings
# ------------------------------------------------------------
ability-settings:
  enabled: true
  # Cooldowns in the action bar while holding a weapon with abilities
  hud: true
  # Can abilities hurt players? (PvP disabled in a world/region is always respected)
  damage-players: true
  # Damage multiplier for abilities against players (0.5 = half)
  pvp-multiplier: 1.0
  # Worlds where abilities don't work (e.g. spawn / lobby)
  disabled-worlds: []

# ------------------------------------------------------------
#  WEAPONS
#  attack-damage / attack-speed are TOTAL values (as in the tooltip).
#  Vanilla sword: damage 7-9, speed 1.6; axe: speed 0.9-1.1
#  Enchant names: minecraft keys in lower case (sharpness, power, ...)
#
#  abilities:
#    passive:   potion effects while the weapon is held in the main hand
#               effects: { effect_name: level-1 }   (0 = level I)
#    on-hit:    effects on hit (charged melee hit, or an arrow from this bow)
#               types: ECHO, CRUSH, RICOCHET, SOUL, LIFESTEAL
#    active:    abilities with a cooldown (seconds)
#               trigger: RIGHT_CLICK, SHIFT_RIGHT_CLICK, SWAP (F key), SHIFT_SWAP
#               types: REWIND, RESONANCE, GRAVITY_ANCHOR, UPHEAVAL,
#                      MIRROR_SHOT, HEX_MARK, SOUL_LINK, HARVEST
#    arrow-trail: particle behind arrows (bows only), e.g. WITCH
#  The ability list is added to the item lore automatically.
#  To remove a default on-hit list, write: on-hit: []
# ------------------------------------------------------------
weapons:
  echo_blade:
    material: NETHERITE_SWORD
    name: "&3&lEcho Blade"
    lore:
      - "&7Every strike rings twice."
    custom-model-data: 1001
    unbreakable: true
    attack-damage: 9
    attack-speed: 1.6
    enchants:
      sharpness: 5
    abilities:
      on-hit:
        - type: ECHO
          chance: 100
          percent: 40
          delay-ticks: 30
          description: ["Echo: 1.5s later the hit repeats", "for 40% of its damage."]
      active:
        rewind:
          type: REWIND
          name: "&3Rewind"
          trigger: RIGHT_CLICK
          cooldown: 30
          description: ["Snap back to where you stood 4s ago", "and regain the health you had then."]
          seconds: 4
        resonance:
          type: RESONANCE
          name: "&b&lResonance"
          trigger: SHIFT_RIGHT_CLICK
          cooldown: 40
          description: ["Everyone you hurt in the last 10s", "takes 50% of that damage again (max 14)."]
          radius: 12
          percent: 50
          window: 10
          max-damage: 14
    forge:
      - { item: NETHERITE_SWORD, amount: 1 }
      - { item: ECHO_SHARD, amount: 8 }
      - { item: SCULK_CATALYST, amount: 4 }
      - { item: AMETHYST_SHARD, amount: 32 }
      - { item: NETHER_STAR, amount: 1 }

  graviton_hammer:
    material: DIAMOND_AXE
    name: "&5&lGraviton Hammer"
    lore:
      - "&7Heavier than it has any right to be."
    custom-model-data: 1002
    unbreakable: true
    attack-damage: 12
    attack-speed: 0.9
    enchants:
      sharpness: 5
      efficiency: 5
    abilities:
      passive:
        effects: { resistance: 0 }
        description: "Resistance I"
      on-hit:
        - type: CRUSH
          chance: 100
          damage-per-block: 1.5
          max-bonus: 8
          slam: 1.6
          slow-ticks: 30
          description: ["Crushing Weight: +1.5 dmg per block", "you're above the target, airborne", "targets get slammed down."]
      active:
        anchor:
          type: GRAVITY_ANCHOR
          name: "&5Gravity Anchor"
          trigger: RIGHT_CLICK
          cooldown: 35
          description: ["Drop a 7-block gravity field for 6s.", "Enemies inside are slowed and", "yanked back if they try to leave."]
          radius: 7
          duration: 6
          pull: 0.5
          slow-level: 2
        upheaval:
          type: UPHEAVAL
          name: "&d&lUpheaval"
          trigger: SHIFT_RIGHT_CLICK
          cooldown: 45
          description: ["Lift every enemy around you into the air,", "then slam them down. The higher they", "are, the harder they hit (max 12)."]
          radius: 6
          lift-ticks: 25
          base-damage: 4
          damage-per-block: 1
          max-damage: 12
    forge:
      - { item: DIAMOND_AXE, amount: 1 }
      - { item: HEAVY_CORE, amount: 1 }
      - { item: OBSIDIAN, amount: 32 }
      - { item: IRON_BLOCK, amount: 16 }
      - { item: NETHER_STAR, amount: 1 }

  hex_bow:
    material: BOW
    name: "&2&lHexbow"
    lore:
      - "&7Strung with something that still twitches."
    custom-model-data: 1003
    unbreakable: true
    enchants:
      power: 5
      infinity: 1
    abilities:
      passive:
        effects: { speed: 0 }
        description: "Speed I"
      arrow-trail: WITCH
      on-hit:
        - type: RICOCHET
          chance: 40
          percent: 60
          range: 8
          description: ["Ricochet: the hex jumps to the nearest", "other enemy for 60% damage."]
      active:
        mirror:
          type: MIRROR_SHOT
          name: "&aMirror Shot"
          trigger: SWAP
          cooldown: 22
          description: ["Your next arrow (10s) swaps your", "place with whatever it hits."]
          window: 10
        hex:
          type: HEX_MARK
          name: "&2&lHex Mark"
          trigger: SHIFT_SWAP
          cooldown: 35
          description: ["Curse the target you look at (32 blocks):", "it glows and takes +30% damage", "from everything for 10s."]
          range: 32
          duration: 10
          amplify: 30
    forge:
      - { item: BOW, amount: 1 }
      - { item: FERMENTED_SPIDER_EYE, amount: 16 }
      - { item: EMERALD_BLOCK, amount: 8 }
      - { item: STRING, amount: 32 }
      - { item: NETHER_STAR, amount: 1 }

  soulbinder:
    material: NETHERITE_HOE
    name: "&b&lSoulbinder"
    lore:
      - "&7It keeps what it takes."
    custom-model-data: 1004
    unbreakable: true
    attack-damage: 10
    attack-speed: 1.2
    enchants:
      sharpness: 5
    abilities:
      on-hit:
        - type: SOUL
          chance: 100
          max: 5
          on-kill: 2
          description: ["Collect a soul per hit, 2 per kill", "(max 5)."]
        - type: LIFESTEAL
          chance: 100
          percent: 15
          description: "Heals 15% of damage dealt"
      active:
        link:
          type: SOUL_LINK
          name: "&3Soul Link"
          trigger: RIGHT_CLICK
          cooldown: 40
          description: ["Chain your soul to a target for 6s:", "50% of damage you take hits them instead."]
          range: 20
          duration: 6
          percent: 50
          break-distance: 25
        harvest:
          type: HARVEST
          name: "&b&lHarvest"
          trigger: SHIFT_RIGHT_CLICK
          cooldown: 15
          description: ["Spend all souls: heal 1 heart each, gain", "absorption and launch homing wisps", "(3 dmg per soul)."]
          heal-per-soul: 2
          absorption-seconds: 15
          damage-per-soul: 3
          range: 16
    forge:
      - { item: NETHERITE_HOE, amount: 1 }
      - { item: SOUL_SAND, amount: 64 }
      - { item: SOUL_LANTERN, amount: 8 }
      - { item: CRYING_OBSIDIAN, amount: 32 }
      - { item: NETHER_STAR, amount: 2 }

# ------------------------------------------------------------
#  MYSTERY CRATES (shulker boxes)
#  color: NONE (default purple) or a vanilla color: WHITE, GRAY, RED, BLUE, ...
#  loot: item (vanilla material / weapon:id / box:id), amount, weight, broadcast
#  Chance = weight / sum of all weights in that crate.
#  Open with right-click while holding the crate.
# ------------------------------------------------------------
boxes:
  common:
    color: GRAY
    name: "&7Common Crate"
    lore:
      - "&7Right-click to open."
    forge:
      - { item: IRON_INGOT, amount: 32 }
      - { item: CHEST, amount: 4 }
    loot:
      - { item: IRON_INGOT, amount: 16, weight: 40 }
      - { item: GOLD_INGOT, amount: 8, weight: 30 }
      - { item: DIAMOND, amount: 2, weight: 20 }
      - { item: GOLDEN_APPLE, amount: 2, weight: 8 }
      - { item: "weapon:hex_bow", amount: 1, weight: 2, broadcast: true }

  rare:
    color: BLUE
    name: "&9Rare Crate"
    lore:
      - "&7Right-click to open."
      - "&9Better loot than the common one."
    forge:
      - { item: "box:common", amount: 3 }
      - { item: DIAMOND, amount: 16 }
    loot:
      - { item: DIAMOND, amount: 8, weight: 35 }
      - { item: EMERALD, amount: 16, weight: 30 }
      - { item: ENCHANTED_GOLDEN_APPLE, amount: 1, weight: 15 }
      - { item: "weapon:hex_bow", amount: 1, weight: 12, broadcast: true }
      - { item: "weapon:echo_blade", amount: 1, weight: 8, broadcast: true }

  legendary:
    color: ORANGE
    name: "&6&lLegendary Crate"
    lore:
      - "&7Right-click to open."
      - "&6A shot at the best weapons."
    forge:
      - { item: "box:rare", amount: 3 }
      - { item: NETHERITE_INGOT, amount: 8 }
    loot:
      - { item: NETHERITE_INGOT, amount: 4, weight: 40 }
      - { item: NETHER_STAR, amount: 1, weight: 20 }
      - { item: TOTEM_OF_UNDYING, amount: 1, weight: 15 }
      - { item: "weapon:echo_blade", amount: 1, weight: 10, broadcast: true }
      - { item: "weapon:hex_bow", amount: 1, weight: 10, broadcast: true }
      - { item: "weapon:graviton_hammer", amount: 1, weight: 6, broadcast: true }
      - { item: "weapon:soulbinder", amount: 1, weight: 4, broadcast: true }
