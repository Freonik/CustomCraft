name: CustomCraft
version: ${project.version}
main: cz.customcraft.CustomCraft
api-version: '1.21'
description: Custom zbraně, mystery boxy (shulkery) a menu receptů
authors: [ filip ]

commands:
  recepty:
    description: Otevře menu s recepty custom itemů
    usage: /<command> [reload|give]
    aliases: [recipes, receptar]

permissions:
  customcraft.use:
    description: Otevření menu receptů a otevírání mystery boxů
    default: true
  customcraft.admin:
    description: Reload konfigurace a /recepty give
    default: op
