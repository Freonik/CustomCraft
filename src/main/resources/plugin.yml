name: CustomCraft
version: ${project.version}
main: cz.customcraft.CustomCraft
api-version: '1.21'
description: Custom weapons with abilities, mystery crates (shulkers) and a forge menu
authors: [ filip ]

commands:
  forge:
    description: Opens the forge menu with custom item recipes
    usage: /<command> [reload|give]
    aliases: [recipes, recepty]

permissions:
  customcraft.use:
    description: Open the forge menu and open mystery crates
    default: true
  customcraft.nocooldown:
    description: Weapon abilities without cooldowns (for testing)
    default: false
  customcraft.admin:
    description: Reload the config and use /forge give
    default: op
