name: Forgebound
version: ${project.version}
main: cz.forgebound.Forgebound
api-version: '1.21'
description: Legendary one-of-a-kind weapons and relics with abilities, legendary materials and forge rituals
authors: [ filip ]
softdepend: [PlaceholderAPI, TAB]

commands:
  forge:
    description: Forge info and admin tools (the menu opens from a crafting table)
    usage: /<command> [reload|status|give|release|finish|meteor|warden|event|ghost|season|token|seal|tracker|recon]
    aliases: [recipes, recepty]
  legends:
    description: All legends on the server and your own stats with them
    usage: /<command>
    aliases: [legend]
  bounty:
    description: Your bounty, the most wanted legend holders and the Bounty Token exchange
    usage: /<command>
    aliases: [bounties, wanted]

  shop:
    description: The token shop (fixed offers + a weekly rotating offer)
    usage: /<command>
    aliases: [store]
  events:
    description: Which events are running right now
    usage: /<command>
    aliases: [event]
  top:
    description: Leaderboards
    usage: /<command> [category]
    aliases: [leaderboard, leaderboards]
  codex:
    description: Opens the Forge Codex (how everything works)
    usage: /<command>
    aliases: [guide]
  hud:
    description: Hide or show your sidebar
    usage: /<command>
    aliases: [sidebar]
  pay:
    description: Send Bounty Tokens to another player
    usage: /<command> <player> <amount>

permissions:
  forgebound.use:
    description: Use the forge at a crafting table and open mystery crates
    default: true
  forgebound.nocooldown:
    description: Weapon abilities without cooldowns (for testing)
    default: false
  forgebound.admin:
    description: /forge reload, give, status, release and finish
    default: op
